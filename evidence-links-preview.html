<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة زر روابط الأدلة | الحزم</title><style>:root{--p:#70558d;--t:#188f90;--bg:#f9f8fc}*{box-sizing:border-box}body{font:15px/1.8 Tahoma,Arial;background:var(--bg);color:#293047;margin:0;padding:25px}.wrap{max-width:650px;margin:auto}.card{background:white;border:1px solid #e5dfea;border-radius:20px;padding:24px;box-shadow:0 6px 20px #211b3310}h1{color:var(--p);margin-top:0;font-size:24px}p{color:#677184}label{display:block;font-weight:bold;margin:15px 0 5px}input{width:100%;border:1px solid #d8cfe1;border-radius:10px;padding:12px;font:inherit}input[type=url]{direction:ltr}button{cursor:pointer;border:0;border-radius:11px;font:inherit;padding:10px 18px;background:var(--p);color:white}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.ghost{background:#e8f7f5;color:#116e71}.item{padding:12px;border-top:1px solid #e5dfea;display:flex;justify-content:space-between;gap:10px;align-items:center}.item a{color:var(--p)}.item button{background:#f6eaf0;color:#863b62;font-size:12px;padding:5px 10px}.hint{font-size:12px}.status{min-height:22px;color:#116e71}ul{padding:0;list-style:none}</style></head><body><div class="wrap"><div class="card"><h1>💜 روابط الأدلة</h1><p>نموذج تجريبي مستقل عن بوابة الحزم. احفظي رابط الملف السحابي بدل رفعه داخل المتصفح.</p><label for="name">اسم الملف أو الدليل</label><input id="name" placeholder="مثال: أدلة المبادرة"><label for="url">رابط عرض الملف من SharePoint أو OneDrive</label><input id="url" type="url" placeholder="https://..."><div class="row"><button id="save">＋ إضافة الرابط</button><button class="ghost" id="clearInputs">مسح الخانات</button></div><p class="status" id="status" role="status"></p><h2 style="font-size:18px">الأدلة المحفوظة</h2><ul id="links"></ul><p class="hint">تُحفظ الروابط على هذا الجهاز وفي هذا المتصفح فقط. صلاحية مشاهدة الملفات يحددها إعداد المشاركة في مصدر الملف. هذه نسخة للتجربة ولا تغيّر بوابة الحزم.</p></div></div><script>(function(){const k='hazm-preview-links-20261020';let records=[];try{const x=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(x))records=x}catch(e){}const q=id=>document.getElementById(id);const status=t=>q('status').textContent=t;function persist(){try{localStorage.setItem(k,JSON.stringify(records));return true}catch(e){status('تعذّر حفظ الروابط في هذا المتصفح.');return false}}function render(){const list=q('links');list.textContent='';if(!records.length){const li=document.createElement('li');li.textContent='لا توجد روابط بعد.';list.appendChild(li)}records.forEach((r,i)=>{const li=document.createElement('li');li.className='item';const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=(r.name||'دليل')+' — عرض ↗';const b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{if(confirm('حذف الرابط من القائمة فقط؟')){records.splice(i,1);if(persist())render()}};li.append(a,b);list.appendChild(li)})}q('save').onclick=()=>{let u;try{u=new URL(q('url').value.trim());if(!['http:','https:'].includes(u.protocol))throw Error()}catch(e){status('يرجى إدخال رابط صحيح يبدأ بـ https://');return}records.push({name:q('name').value.trim()||'دليل',url:u.href});if(persist()){q('name').value='';q('url').value='';status('تم حفظ رابط العرض.');render()}};q('clearInputs').onclick=()=>{q('name').value='';q('url').value='';status('')};render()})();</script></body></html>
