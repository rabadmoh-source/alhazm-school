<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص جاهزية ترحيل الزيارات | الحزم</title>
<style>body{font:16px/1.9 Tahoma,Arial;background:#f7f4fc;color:#322947;margin:0}main{max-width:740px;margin:45px auto;padding:27px;background:#fff;border:1px solid #ded5ea;border-radius:18px}h1{color:#67498d}button{padding:10px 18px;background:#67518a;color:#fff;border:0;border-radius:10px;cursor:pointer}button:disabled{opacity:.45}#out{white-space:pre-wrap;background:#f0eef8;border-radius:12px;padding:15px}small{color:#736c7d}</style></head><body>
<main><h1>🔐 فحص جاهزية ترحيل سجلات الزيارات الإشرافية</h1>
<p>تجربة قراءة محلية <strong>دون إرسال بيانات إلى Firebase أو GitHub</strong>. لا تغيّر السجلات ولا تتطلب كلمة مرور.</p>
<button id="inspect">فحص عدد السجلات فقط</button><p id="out" role="status" aria-live="polite">لم يبدأ الفحص.</p>
<small>لا يُعد هذا الاختبار حماية للصفحة الإدارية. لا تنشري أي بيانات خاصة داخل مستودع GitHub العام.</small></main>
<script>
'use strict';
const key='alhazm_supervisory_visits_2026_v1';
const out=document.getElementById('out');
const btn=document.getElementById('inspect');
const correctOrigin=location.protocol==='https:'&&location.hostname==='rabadmoh-source.github.io'&&location.pathname.startsWith('/alhazm-school/');
if(!correctOrigin){btn.disabled=true;out.textContent='هذه الصفحة لا تقرأ السجلات إلا إذا شُغّلت من عنوان بوابة الحزم الأصلي. لا تقرأ بيانات من التنزيلات.';}
btn.addEventListener('click',()=>{
 try{
  const raw=localStorage.getItem(key);
  if(!raw){out.textContent='لا توجد سجلات محلية في هذا المتصفح. لم يتم تعديل أي شيء.';return;}
  const data=JSON.parse(raw);
  if(!data||!Array.isArray(data.visits)||!Array.isArray(data.recs))throw new Error('بنية السجلات غير متوقعة؛ أُوقف الفحص.');
  out.textContent='✅ عدد الزيارات: '+data.visits.length+'\nعدد التوصيات: '+data.recs.length+'\nحجم التخزين التقريبي: '+Math.ceil(new Blob([raw]).size/1024)+' كيلوبايت\nلم تُرسل أي بيانات إلى الشبكة، ولم يتغير التخزين المحلي.';
 }catch(e){out.textContent='⚠️ '+e.message;}
});
</script></body></html>
