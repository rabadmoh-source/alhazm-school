24px;width:min(540px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{display:block;margin:12px 0 6px;font-weight:700}.fieldinp{width:100%;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.bar{display:flex;gap:10px;justify-content:flex-start;margin-top:20px;flex-wrap:wrap}.hint{background:var(--lav);padding:13px;border-radius:12px;color:#544a85;font-size:13px}.hide{display:none!important}@media(max-width:850px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.services{grid-template-columns:1fr}.head{align-items:flex-start;padding:14px 0}.top-actions{flex-wrap:wrap;justify-content:flex-end}.hero{padding:24px}.titleline{flex-direction:column;align-items:flex-start}.search{width:100%}}@media print{.top-actions,.filters,.favorite,.launch,.unready,.search{display:none!important}body{background:white}.hero{color:#23223e;background:#f4eefb}.service{break-inside:avoid}}
