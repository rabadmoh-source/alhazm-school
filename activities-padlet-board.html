<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الأنشطة والمبادرات | الحزم</title><style>
:root{--p:#65368b;--t:#0a8791;--ink:#282036}*{box-sizing:border-box}body{margin:0;background:#f3f0f6;font-family:Tahoma,Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(115deg,#63368b,#178d92);color:white;padding:22px 26px}header h1{font-size:24px;margin:0 0 12px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs a{padding:9px 19px;border-radius:24px;background:#ffffff27;color:white;text-decoration:none;font-weight:bold}.tabs a.active{background:#fff;color:var(--p)}.info{margin:16px 20px 0;padding:13px 16px;border:1px solid #dfd0e6;background:white;border-radius:13px;line-height:1.8;font-size:13px}main{display:flex;overflow-x:auto;gap:15px;padding:20px;align-items:flex-start;min-height:67vh}.lane{flex:0 0 315px;max-width:365px;padding:12px;border-radius:17px;background:#e8e2eb;box-shadow:0 2px 7px #0001}.head{background:#fff;padding:16px;border-radius:12px;border-top:5px solid var(--p);position:sticky;top:0;z-index:2}.lane:nth-child(even) .head{border-top-color:var(--t)}.head h2{margin:0 0 8px;font-size:19px}.head p{margin:6px 0;color:#675c6b;white-space:pre-wrap;font-size:12px;line-height:1.7}.meta{font-size:11px;color:#7a7180;margin:8px 0}.post{background:white;margin:12px 0;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px #0001}.post h3{font-size:14px;line-height:1.5;margin:0;padding:12px}.post img{width:100%;max-height:370px;object-fit:contain;background:#faf9fc;cursor:zoom-in}.post .txt{white-space:pre-wrap;line-height:1.8;padding:12px;font-size:13px}.foot{display:flex;align-items:center;justify-content:space-between;padding:8px;gap:5px;font-size:11px;color:#786d80}.foot div{display:flex;gap:5px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #d9cbe3;color:var(--p);background:#fff;border-radius:9px;padding:9px 11px;font-family:inherit}button:hover{filter:brightness(.97)}.danger{color:#a7324b}.add{width:100%;border:1px dashed #b497c5;background:#fdfaff;font-weight:bold;margin-top:12px}.new{flex:0 0 265px;min-height:165px;border:2px dashed #baa4ca;background:#fdf9ff;border-radius:17px;color:var(--p);font-size:17px;font-weight:bold}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.modal{position:fixed;inset:0;background:#171024cf;display:none;align-items:center;justify-content:center;padding:18px;z-index:8}.modal.on{display:flex}.dialog{background:white;border-radius:17px;padding:22px;width:min(470px,95vw);max-height:90vh;overflow-y:auto}.dialog h2{font-size:19px;margin:0 0 10px}.dialog label{display:block;font-size:13px;font-weight:bold;margin-top:13px}.dialog input,.dialog textarea{width:100%;font:inherit;padding:10px;margin-top:6px;border:1px solid #d9d1e1;border-radius:8px}.dialog textarea{min-height:100px}.dialog .row{justify-content:flex-end}.primary{background:var(--p);color:white}.viewer img{max-width:94vw;max-height:86vh;object-fit:contain}.viewer button{position:fixed;top:12px;left:18px}footer{padding:14px;text-align:center;color:#72687d;font-size:12px}@media(max-width:650px){main{padding:12px}.lane{flex-basis:88vw}header{padding:16px}}</style></head>
<body><header><h1>💜 لوحة الحزم | الأنشطة والمبادرات</h1><nav class="tabs"><a id="activitiesTab" href="?type=activities">الأنشطة</a><a id="initiativesTab" href="?type=initiatives">المبادرات</a><a href="./index.html">العودة للبوابة</a></nav></header><div id="message" class="info">جارٍ قراءة سجلات النافذة الموجودة في هذا المتصفح...</div><main id="board"></main><footer>تُعرض الأنشطة والمبادرات في نافذتين مستقلتين وبنفس تصميم بادليت — التوصيف أولًا ثم الأدلة بحسب تسلسل إدراجها</footer>
<div id="editor" class="modal"><section class="dialog"><h2 id="editorTitle"></h2><label>العنوان<input id="itemTitle"></label><label>التوصيف أو الوصف<textarea id="itemDesc"></textarea></label><label id="fileLabel">المرفق (اختياري عند التعديل)<input type="file" id="itemFile" accept="image/*,application/pdf,video/*,.doc,.docx,.xls,.xlsx,.ppt,.pptx"></label><div class="row"><button id="cancel">إلغاء</button><button class="primary" id="save">حفظ</button></div></section></div><div id="viewer" class="modal viewer"><button id="closeViewer">إغلاق ✕</button><img id="zoomImage"></div>
<script>
(()=>{'use strict';
const DATABASE='alhazm_activities_2026_v1', type=new URLSearchParams(location.search).get('type')==='activities'?'activities':'initiatives';
document.getElementById(type+'Tab').classList.add('active');
const $=id=>document.getElementById(id);let db,storeName,records=[],mode='',activeId=null,activeFile=-1;
function tag(t,c,txt){const x=document.createElement(t);if(c)x.className=c;if(txt!=null)x.textContent=txt;return x}
function msg(s){$('message').textContent=s}
function visible(f){return f&&typeof f.data==='string'&&f.data.startsWith('data:')}
function isImage(f){return visible(f)&&(f.data.startsWith('data:image/')||/\.(png|jpg|jpeg|webp|gif)$/i.test(f.name||''))}
function showFile(f){if(visible(f)){if(isImage(f)){$('zoomImage').src=f.data;$('viewer').classList.add('on')}else{const a=tag('a');a.href=f.data;a.download=f.name||'مرفق';a.click()}}else alert('هذا المرفق غير متاح للعرض هنا')}
function rowBtns(){return tag('div','row')}
function draw(){
 const board=$('board');board.replaceChildren();const list=records.filter(r=>r.type===type).sort((a,b)=>String(a.created||'').localeCompare(String(b.created||'')));
 for(const r of list){
  const lane=tag('section','lane'),head=tag('div','head');head.append(tag('h2','',r.title||'بدون عنوان'),tag('p','',r.category||''),tag('div','meta',(r.owner||'')+(r.status?' | '+r.status:'')));
  const ops=rowBtns(),edit=tag('button','','✎ تعديل العمود'),del=tag('button','danger','حذف العمود');edit.onclick=()=>openEdit('column',r.id);del.onclick=()=>eraseColumn(r.id);ops.append(edit,del);head.append(ops);lane.append(head);
  const desc=tag('article','post');desc.append(tag('h3','','بطاقة التوصيف'));const d=tag('div','txt',r.goal||r.details||'يمكن إضافة التوصيف من تعديل العمود');desc.append(d);lane.append(desc);
  const files=Array.isArray(r.files)?r.files:[];
  files.forEach((f,i)=>{const card=tag('article','post');card.append(tag('h3','',f.description||f.name||'دليل '+(i+1)));
   if(isImage(f)){const im=tag('img');im.loading='lazy';im.src=f.data;im.alt=f.name||'دليل';im.onclick=()=>showFile(f);card.append(im)}
   else if(visible(f)){const b=tag('button','','عرض / تنزيل المرفق');b.onclick=()=>showFile(f);card.append(b)}
   else card.append(tag('div','txt','تعذر عرض هذا المرفق'));
   const foot=tag('div','foot'),actions=tag('div'),a=tag('button','','تعديل'),b=tag('button','danger','حذف');a.onclick=()=>openEdit('file',r.id,i);b.onclick=()=>eraseFile(r.id,i);actions.append(a,b);foot.append(tag('span','', 'شاهد '+(i+1)),actions);card.append(foot);lane.append(card);
  });
  const add=tag('button','add','＋ إضافة دليل أسفل العمود');add.onclick=()=>openEdit('add-file',r.id);lane.append(add);board.append(lane);
 }
 const create=tag('button','new','＋ إضافة عمود '+(type==='activities'?'نشاط':'مبادرة'));create.onclick=()=>openEdit('add-column');board.append(create);
 msg('نافذة '+(type==='activities'?'الأنشطة':'المبادرات')+' — '+list.length+' سجلات. التوصيف ثابت أعلى كل عمود، وتظهر المرفقات الجديدة في نهايته. جميع التغييرات تُحفظ في قاعدة البيانات المحلية نفسها لهذا المتصفح. تنبيه: هذه الواجهة ليست نظام صلاحيات آمنًا للنشر العام.');
}
function read(){return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readonly'),req=tx.objectStore(storeName).getAll();req.onsuccess=()=>{records=req.result||[];resolve()};req.onerror=()=>reject(req.error)})}
function write(record){return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');const s=tx.objectStore(storeName);const req=s.put(record);req.onerror=()=>reject(req.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function remove(id){return new Promise((resolve,reject)=>{const tx=db.transaction(storeName,'readwrite');tx.objectStore(storeName).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function openEdit(m,id,i=-1){mode=m;activeId=id;activeFile=i;const r=records.find(x=>x.id===id),f=r?.files?.[i];
 $('editorTitle').textContent={'column':'تعديل العمود','file':'تعديل الدليل','add-file':'إضافة دليل جديد','add-column':'إضافة عمود جديد'}[m];$('itemTitle').value=m==='column'?r.title:m==='file'?(f.description||f.name||''):'';$('itemDesc').value=m==='column'?(r.goal||''):'';$('itemDesc').parentElement.style.display=m==='column'||m==='add-column'?'block':'none';$('fileLabel').style.display=m==='add-file'||m==='file'?'block':'none';$('itemFile').value='';$('editor').classList.add('on');$('itemTitle').focus()}
async function selectedFile(){const file=$('itemFile').files[0];if(!file)return null;if(file.size>12*1024*1024)throw Error('الملف كبير جدًا. اختاري ملفًا أقل من 12 ميجابايت لتجنب مشكلة الحفظ');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,kind:file.type||'application/octet-stream',description:$('itemTitle').value.trim(),data:reader.result});reader.onerror=reject;reader.readAsDataURL(file)})}
async function save(){const title=$('itemTitle').value.trim(),desc=$('itemDesc').value.trim();if(!title){alert('أدخلي العنوان');return}const button=$('save');button.disabled=true;try{
 let record=records.find(x=>x.id===activeId),file=await selectedFile();
 if(mode==='add-column'){record={id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),type,created:new Date().toISOString(),updated:new Date().toISOString(),title,category:'',owner:'',audience:'',start:'',end:'',status:'قيد التنفيذ',goal:desc,details:'',impact:'',measure:'',evidence:'',link:'',notes:'',files:[]}}
 if(mode==='column'){record={...record,title,goal:desc,updated:new Date().toISOString()}}
 if(mode==='add-file'){if(!file)throw Error('اختاري الملف المراد إضافته');record={...record,files:[...(record.files||[]),file],updated:new Date().toISOString()}}
 if(mode==='file'){const arr=[...(record.files||[])];arr[activeFile]={...arr[activeFile],...(file||{}),description:title};record={...record,files:arr,updated:new Date().toISOString()}}
 await write(record);await read();$('editor').classList.remove('on');draw();
 }catch(e){alert('لم يكتمل الحفظ: '+e.message)}finally{button.disabled=false}}
async function eraseColumn(id){const r=records.find(x=>x.id===id);if(!r||!confirm('هل تريدين حذف عمود «'+r.title+'» وكل مرفقاته؟ لا يمكن التراجع عن ذلك.'))return;try{await remove(id);await read();draw()}catch(e){alert('تعذر الحذف: '+e.message)}}
async function eraseFile(id,i){const r=records.find(x=>x.id===id);if(!r||!confirm('هل تريدين حذف الشاهد «'+(r.files[i].name||'')+'»؟'))return;try{const files=[...r.files];files.splice(i,1);await write({...r,files,updated:new Date().toISOString()});await read();draw()}catch(e){alert('تعذر الحذف: '+e.message)}}
$('save').onclick=save;$('cancel').onclick=()=>$('editor').classList.remove('on');$('closeViewer').onclick=()=>$('viewer').classList.remove('on');
function init(){const req=indexedDB.open(DATABASE);req.onupgradeneeded=()=>{req.transaction.abort()};req.onerror=()=>msg('لم يُعثر على قاعدة الأنشطة والمبادرات في هذا المتصفح. افتحي البوابة الأصلية أولًا ثم أعيدي فتح هذه الصفحة.');req.onsuccess=async()=>{db=req.result;try{for(const n of db.objectStoreNames){const tx=db.transaction(n,'readonly');const s=tx.objectStore(n);const all=await new Promise((ok,no)=>{const q=s.getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});if(Array.isArray(all)&&all.some(x=>x&&typeof x==='object'&&'title' in x&&'type' in x)){storeName=n;break}}if(!storeName&&db.objectStoreNames.length===1)storeName=db.objectStoreNames[0];if(!storeName)throw Error('تعذر العثور على السجلات');await read();draw()}catch(e){msg('تعذر قراءة السجلات: '+e.message)}}}
init();
})();
</script></body></html>
