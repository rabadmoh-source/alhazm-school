<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دقيقة جودة | نافذة الزوار</title>
<style>:root{--p:#6954a8;--t:#138e92}*{box-sizing:border-box}body{margin:0;background:#f7f6fb;color:#28223e;font:16px/1.9 Tahoma,Arial}header{background:linear-gradient(115deg,#59428f,#745ab0,#138e92);color:white;padding:30px 18px 48px}.wrap{max-width:980px;margin:auto;padding:0 18px}h1{margin:14px 0 0;font-size:clamp(26px,5vw,40px)}header p{margin:4px 0;color:#edf9fa}.back{color:white;text-decoration:none;border:1px solid #ffffff77;border-radius:25px;padding:7px 14px;display:inline-block}.panel{background:white;border:1px solid #e6e0ef;border-radius:20px;padding:23px;margin:18px 0;box-shadow:0 6px 25px #34245d0b}main{margin-top:-25px;position:relative}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.item{border:1px solid #e5dff0;border-radius:15px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}.item b{font-size:18px}.tag{color:#65509e;font-weight:bold;font-size:13px}.btn{display:inline-block;background:var(--p);color:white;padding:9px 16px;border-radius:10px;text-decoration:none;align-self:flex-start}.closed{background:#edf7f5;color:#137c7e;border-radius:9px;padding:2px 9px;align-self:flex-start;font-size:13px}.muted{color:#716c7e}.empty{text-align:center;padding:35px 10px}.badge{display:inline-block;background:#ffffff2b;border:1px solid #ffffff55;padding:2px 12px;border-radius:20px}</style></head>
<body><header><div class="wrap"><a class="back" href="./visitor.html">↩ العودة إلى نافذة الزوار</a><div style="margin-top:22px"><span class="badge">👁️ نافذة الزوار · عرض ومشاركة فقط</span></div><h1>⏱️ دقيقة جودة</h1><p>دقيقة من التحدي… وثقافة من التميز</p></div></header>
<main class="wrap"><section class="panel"><h2>🌟 تحديات دقيقة جودة المنشورة</h2><p class="muted">تظهر هنا الأسئلة التي تنشرها إدارة المدرسة فقط. يمكن المشاركة في التحديات المفتوحة، والاطلاع على نتائج التحديات المغلقة.</p><div id="status" class="muted">جارٍ تحميل التحديات المنشورة…</div><div id="cards" class="cards"></div></section></main>
<script>
const ROOT="https://fmmilquujleokfxcbnas.supabase.co",KEY="sb_publishable_O_JqIM-VqzdGgU8VTvhRHQ_eQ9eTH5R";
const status=document.getElementById("status"),cards=document.getElementById("cards");
async function load(){try{const response=await fetch(ROOT+"/rest/v1/rpc/hazm_quality_public_published",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:"{}"});if(!response.ok)throw Error("تعذر تحميل الأسئلة المنشورة ("+response.status+")");const items=await response.json();cards.replaceChildren();if(!items.length){status.textContent="🌷 لا يوجد سؤال منشور حاليًا. سيظهر التحدي هنا بمجرد نشره من الإدارة.";status.className="empty";return}status.textContent="التحديات المنشورة: "+items.length;for(const q of items){const article=document.createElement("article");article.className="item";const tag=document.createElement("span");tag.className="tag";tag.textContent=q.group_name||"دقيقة جودة";const title=document.createElement("b");title.textContent=q.question||"";const state=document.createElement("span");state.className=q.closed?"closed":"tag";state.textContent=q.closed?"✓ انتهى التحدي · النتائج متاحة":"✨ التحدي مفتوح للمشاركة";const link=document.createElement("a");link.className="btn";link.textContent=q.closed?"📊 الاطلاع على النتائج":"✍️ المشاركة في التحدي";link.href="./daqeeqat-jawda-challenge.html?id="+encodeURIComponent(q.id);article.append(tag,title,state,link);cards.append(article)}}catch(e){status.textContent="⚠️ "+e.message}}
load();
</script></body></html>
