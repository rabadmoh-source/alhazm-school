<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبادرة دقيقة جودة | مدرسة الحزم</title><style>:root{--p:#6653a7;--t:#138f95;--bg:#f8f7fc}*{box-sizing:border-box}body{font:16px/1.8 Tahoma,Arial;background:var(--bg);color:#25233b;margin:0}header{background:linear-gradient(115deg,var(--p),var(--t));color:white;padding:30px 18px;text-align:center}h1{margin:5px}main{max-width:950px;margin:25px auto;padding:0 15px}.notice{background:#fff5d7;border-right:5px solid #bd9228;padding:14px;border-radius:9px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button,button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#e9e4f5;color:#403071}.tabs button.active{background:var(--p);color:white}.card{background:white;border:1px solid #e6e2ef;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 10px #24203b09}.tag{color:var(--t);font-weight:bold}details{margin-top:14px;background:#f2f9f9;padding:10px;border-radius:8px}summary{cursor:pointer;font-weight:bold}.sub{color:#666}footer{text-align:center;padding:25px;color:#666}a{color:var(--p)}.question{font-size:19px;font-weight:bold}</style></head><body><header><div>مدرسة الحزم للتعليم الأساسي (1–4)</div><h1>⏱️ مبادرة دقيقة جودة</h1><div>دقيقة من التحدي… وثقافة من التميز</div></header><main><div class="notice"><b>نسخة تحضيرية للمراجعة الإدارية فقط.</b> لم يُفعّل استقبال الإجابات أو التصحيح الذكي أو إعلان النتائج بعد. لا تُرسل بيانات شخصية عبر هذه الصفحة.</div><div class="tabs" id="tabs"></div><div id="cards"></div><p><a href="./index.html">العودة إلى بوابة الحزم</a></p></main><footer>إعداد: مديرة المدرسة رباب محمد العجمية</footer><script>
const data=[
{group:"الطلبة",q:"ماذا تفعل إذا لم تفهم الدرس؟",a:"أطلب من المعلمة توضيح الفكرة، وأحاول مرة أخرى، وأشارك في النشاط.",e:"ملاحظات الجولات الصفية، نماذج أعمال الطلبة، وممارسات طلب المساعدة داخل الصف."},
{group:"المعلمات والمعلمون",q:"كيف تتحقق من فهم جميع الطلبة أثناء الحصة؟",a:"أستخدم أسئلة متنوعة ومهامًا فردية قصيرة وأحلل استجابات الطلبة ثم أقدم الدعم المناسب.",e:"أدوات التقويم التكويني، تحليل الاستجابات، ونماذج أعمال الطلبة."},
{group:"الإدارة المدرسية",q:"كيف تتحقق الإدارة من أثر الزيارات الإشرافية؟",a:"نتابع تنفيذ التوصيات، ونلاحظ الممارسات لاحقًا، ونقارن شواهد الأداء والتعلم قبل التدخل وبعده.",e:"سجلات الزيارات الإشرافية، متابعة التوصيات، وتقارير قياس الأثر."},
{group:"المعلمات الأوائل",q:"كيف تحددين أولويات الإنماء المهني؟",a:"أحلل نتائج تعلم الطلبة وملاحظات الزيارات، وأحدد الاحتياجات ثم أقيس أثر البرامج على التدريس والتعلم.",e:"خطط الإنماء المهني، محاضر مجتمعات التعلم، ونتائج قياس الأثر."},
{group:"أولياء الأمور",q:"كيف تسهم في تحسين تعلم ابنك؟",a:"أتابع تعلمه في المنزل، وأتواصل مع المدرسة، وأشارك في تنفيذ توصيات دعم التعلم.",e:"سجلات التواصل والشراكات، ومحاضر اللقاءات، وشواهد أثر الدعم."}
];let active="الكل";function render(){document.getElementById("tabs").innerHTML=["الكل",...data.map(x=>x.group)].map(x=>'<button class="'+(active===x?'active':'')+'" data-group="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{active=b.dataset.group;render()});document.getElementById("cards").innerHTML=data.filter(x=>active==="الكل"||x.group===active).map((x,i)=>'<section class="card"><div class="tag">البطاقة التجريبية 01 · '+x.group+'</div><div class="question">'+x.q+'</div><details><summary>الإجابة النموذجية والشواهد المقترحة (للمراجعة)</summary><p><b>الإجابة:</b> '+x.a+'</p><p><b>الشواهد:</b> '+x.e+'</p><small>هذه شواهد مقترحة وليست تأكيدًا لتوافرها في السجلات.</small></details></section>').join("")}render();
</script></body></html>
